[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonpit"
version = "0.1.3"
description = "Daemon-free distributed storage over Cloud Drives for developers and AI agents — multi-process, immutable history, zero dependencies."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
	{ name = "Dr. Rainer Burkhardt" },
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Database :: Database Engines/Servers",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
jpit = "jsonpit.cli:main"
jsonpit = "jsonpit.cli:main"

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-cov>=5.0",
	"mypy>=1.10",
	"ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["jsonpit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
